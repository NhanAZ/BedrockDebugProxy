version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - gosec
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - noctx
  settings:
    errcheck:
      check-type-assertions: true
    staticcheck:
      checks:
        - all
        - -QF*
        - -ST1000
    gosec:
      excludes:
        # The CLI intentionally accepts operator-selected local input and output paths.
        # Capture-internal paths have separate canonical-path and symlink checks.
        - G304

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
